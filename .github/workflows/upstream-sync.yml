name: Sync Fork From Upstream

on:
  schedule:
    - cron: "31 8 * * 3"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPSTREAM_REPOSITORY: orionblur/NeoFreeBird
      DOWNSTREAM_BRANCH: v6
    steps:
      - name: Check out downstream history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: v6
          submodules: recursive
      - name: Resolve upstream v6
        id: upstream
        run: |
          set -euo pipefail
          git remote add authoritative-upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags authoritative-upstream v6
          upstream_sha=$(git rev-parse FETCH_HEAD)
          echo "sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "short=${upstream_sha:0:12}" >> "$GITHUB_OUTPUT"
      - name: Merge into review branch
        id: merge
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          SHORT_SHA: ${{ steps.upstream.outputs.short }}
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="automation/upstream-sync-${SHORT_SHA}"
          git switch -c "$branch"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git merge --no-edit "$UPSTREAM_SHA"; then
            git diff --name-only --diff-filter=U >> "$GITHUB_STEP_SUMMARY"
            git merge --abort
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Install build dependencies
        if: steps.merge.outputs.changed == 'true'
        run: brew install make dpkg ldid
      - name: Add GNU Make to PATH
        if: steps.merge.outputs.changed == 'true'
        run: echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Check out Theos
        if: steps.merge.outputs.changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive
      - name: Install iOS 16.5 SDK
        if: steps.merge.outputs.changed == 'true'
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          git clone -n --depth=1 --filter=tree:0 https://github.com/theos/sdks/ "$RUNNER_TEMP/theos-sdks"
          git -C "$RUNNER_TEMP/theos-sdks" sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git -C "$RUNNER_TEMP/theos-sdks" checkout
          mv "$RUNNER_TEMP/theos-sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
      - name: Validate preserved downstream behavior
        if: steps.merge.outputs.changed == 'true'
        env:
          THEOS: ${{ github.workspace }}/theos
        run: scripts/validate-downstream.sh --build
      - name: Push review branch and open pull request
        if: steps.merge.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.merge.outputs.branch }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -euo pipefail
          git push --set-upstream origin "$BRANCH"
          existing=$(gh pr list --head "$BRANCH" --base "$DOWNSTREAM_BRANCH" --state open --json url --jq '.[0].url // empty')
          if [[ -z "$existing" ]]; then
            gh pr create --head "$BRANCH" --base "$DOWNSTREAM_BRANCH" \
              --title "chore: sync orionblur/NeoFreeBird v6" \
              --body "Merges \`${UPSTREAM_REPOSITORY}@${UPSTREAM_SHA}\` through the downstream package validation contract."
          fi
